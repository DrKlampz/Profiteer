name: Package and release

on:
  workflow_dispatch:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY || secrets.CURSEFORGE || secrets.CURSE }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN || secrets.WAGO_API_KEY || secrets.KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2

      - name: Update Discord
        if: success()
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1555748496165048391"
          DISCORD_MODE: ${{ (github.event_name == 'push' || github.ref_type == 'tag') && 'release' || 'sync' }}
        run: bash .github/discord-notify.sh
